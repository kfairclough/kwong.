<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070707"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="T_SCENTS"><title>T_SCENTS Mobile Sales v2.3</title><style>html,body{margin:0;min-height:100%;background:#070707;color:#f0c66e;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.load{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}.card{max-width:420px;border:1px solid #6f5224;border-radius:16px;padding:24px;background:#0d0d0d}.mark{width:76px;height:76px;border:2px solid #d7a64c;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 15px;font-weight:900;font-size:21px}.small{font-size:11px;color:#9b9285;line-height:1.5}</style></head><body><div class="load"><div class="card"><div class="mark">TS</div><b>Loading T_SCENTS…</b><p class="small" id="status">Preparing Mobile Sales v2.3.</p></div></div><script>(async()=>{try{if(!('DecompressionStream'in window))throw new Error('This iPhone/Safari version is too old for this app loader. Update iOS and try again.');const names=['v23.part01.txt','v23.part02.txt','v23.part03.txt','v23.part04.txt','v23.part05.txt','v23.part06.txt','v23.part07.txt','v23.part08.txt','v23.part09.txt','v23.part10.txt','v23.part11.txt','v23.part12.txt','v23.part13.txt'];const parts=await Promise.all(names.map(n=>fetch(n+'?v=23',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Could not load '+n);return r.text()})));const b64=parts.join('').replace(/\s/g,'');const raw=atob(b64);const bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){document.getElementById('status').textContent='Unable to load T_SCENTS: '+e.message}})();</script></body></html>

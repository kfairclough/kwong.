<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070707"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="T_SCENTS"><title>T_SCENTS Mobile Sales v2.4</title><style>html,body{margin:0;min-height:100%;background:#070707;color:#f0c66e;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.load{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}.card{max-width:420px;border:1px solid #6f5224;border-radius:16px;padding:24px;background:#0d0d0d}.mark{width:76px;height:76px;border:2px solid #d7a64c;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 15px;font-weight:900;font-size:21px}.small{font-size:11px;color:#9b9285;line-height:1.5}</style></head><body><div class="load"><div class="card"><div class="mark">TS</div><b>Loading T_SCENTS…</b><p class="small" id="status">Preparing Mobile Sales v2.4.</p></div></div><script>(async()=>{try{if(!('DecompressionStream'in window))throw new Error('This iPhone/Safari version is too old for this app loader. Update iOS and try again.');const names=['v23.part01.txt','v23.part02.txt','v23.part03.txt','v23.part04.txt','v23.part05.txt','v23.part06.txt','v23.part07.txt','v23.part08.txt','v23.part09.txt','v23.part10.txt','v23.part11.txt','v23.part12.txt','v23.part13.txt'];const parts=await Promise.all(names.map(n=>fetch(n+'?v=24',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Could not load '+n);return r.text()})));const b64=parts.join('').replace(/\s/g,'');const raw=atob(b64);const bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));let html=await new Response(stream).text();html=html.replace('T_SCENTS Mobile Sales v2.3','T_SCENTS Mobile Sales v2.4');const patch=`<script>
(function(){
function publicStockUrl(){return 'https://api.github.com/repos/'+encodeURIComponent(cloudCfg.owner)+'/kwong./contents/stock/public-stock.json'}
function publicStockPayload(){let items=[];for(const x of state.items)if(int(x.qty)>0)items.push({name:String(x.name||''),category:String(x.category||'Fragrance'),ml:int(x.ml),qty:int(x.qty)});for(const x of state.generalItems)if(int(x.qty)>0)items.push({name:String(x.name||''),category:'General Item',ml:null,qty:int(x.qty)});return{updatedAt:String(state._modifiedAt||new Date().toISOString()),items}}
async function publishPublicStock(){try{if(!cloudReady())return false;let url=publicStockUrl(),r=await fetch(url,{headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+cloudCfg.token,'X-GitHub-Api-Version':'2022-11-28'}}),sha='';if(r.status===200){let o=await r.json();sha=o.sha||''}else if(r.status!==404){throw Error('GitHub returned '+r.status)}let body={message:'Update T_SCENTS public stock',content:b64enc(JSON.stringify(publicStockPayload(),null,2))};if(sha)body.sha=sha;let p=await fetch(url,{method:'PUT',headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+cloudCfg.token,'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},body:JSON.stringify(body)});return p.ok}catch(e){console.warn('Public stock update failed',e);return false}}
window.publishPublicStock=publishPublicStock;
const oldPut=cloudPut;cloudPut=async function(){await oldPut();return await publishPublicStock()};
const oldApply=applyRemote;applyRemote=async function(r,manual=false){await oldApply(r,manual);await publishPublicStock()};
const oldSync=cloudSyncNow;cloudSyncNow=async function(){await oldSync();if(cloudReady()){let ok=await publishPublicStock();if(!ok)toast('Private cloud synced, but public stock could not update. Add the kwong. repo to this token with Contents read/write.',true)}};
})();
<\/script>`;html=html.replace('</body>',patch+'</body>');document.open();document.write(html);document.close()}catch(e){document.getElementById('status').textContent='Unable to load T_SCENTS: '+e.message}})();</script></body></html>

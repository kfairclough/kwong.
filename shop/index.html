<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070707"><title>T_SCENTS Shop</title><style>:root{--bg:#070707;--panel:#0e0e0e;--gold:#d7a64c;--gold2:#f0c66e;--muted:#9b9285;--line:#5b421f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f8e7bc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.wrap{max-width:960px;margin:auto;padding:18px}.head{display:flex;align-items:center;gap:14px;margin:8px 0 18px}.logo{width:62px;height:62px;border:2px solid var(--gold);border-radius:50%;display:grid;place-items:center;font-weight:900;color:var(--gold2);letter-spacing:1px}.title h1{margin:0;font-size:24px}.title p{margin:4px 0 0;color:var(--muted);font-size:13px}.search{width:100%;padding:14px 15px;border-radius:12px;border:1px solid var(--line);background:#111;color:white;outline:none;margin-bottom:10px}.tabs{display:flex;gap:8px;overflow:auto;padding:2px 0 5px}.tab{white-space:nowrap;padding:9px 12px;border-radius:999px;border:1px solid var(--line);background:#0b0b0b;color:#d8c49f}.tab.on{background:var(--gold2);color:#111;border-color:var(--gold2);font-weight:800}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0 16px}.stat{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:14px}.stat b{font-size:22px;color:var(--gold2)}.stat span{display:block;color:var(--muted);font-size:12px;margin-top:3px}.grid{display:grid;grid-template-columns:1fr;gap:10px}.card{border:1px solid var(--line);background:linear-gradient(180deg,#111,#0b0b0b);border-radius:14px;padding:14px;display:flex;align-items:center;justify-content:space-between;gap:14px}.name{font-weight:800;font-size:15px;line-height:1.25}.meta{font-size:12px;color:var(--muted);margin-top:5px}.qty{min-width:74px;text-align:center;border-left:1px solid #3b2a16;padding-left:12px}.qty b{display:block;font-size:24px;color:var(--gold2)}.qty span{font-size:11px;color:var(--muted)}.empty{padding:28px;text-align:center;border:1px dashed var(--line);border-radius:14px;color:var(--muted)}.foot{text-align:center;color:#756d62;font-size:11px;margin:18px 0 6px}.updated{color:var(--muted);font-size:11px;margin-top:8px}@media(min-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(4,1fr)}}</style></head><body><main class="wrap"><header class="head"><div class="logo">TS</div><div class="title"><h1>T_SCENTS Shop</h1><p>Browse what is currently in stock</p><div class="updated" id="updated">Loading current stock…</div></div></header><input class="search" id="search" placeholder="Search items…"><div class="tabs" id="tabs"><button class="tab on" data-filter="All">All</button><button class="tab" data-filter="Aftershave">Aftershaves</button><button class="tab" data-filter="Perfume">Perfumes</button><button class="tab" data-filter="Unisex">Unisex</button><button class="tab" data-filter="General Item">General Items</button></div><section class="stats"><div class="stat"><b id="products">0</b><span>Products available</span></div><div class="stat"><b id="units">0</b><span>Total units in stock</span></div><div class="stat"><b id="fragrances">0</b><span>Fragrance lines</span></div><div class="stat"><b id="general">0</b><span>General item lines</span></div></section><section id="grid" class="grid"></section><div class="foot">T_SCENTS Shop</div></main><script>let all=[],filter='All';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function render(){const q=$('search').value.trim().toLowerCase();const rows=all.filter(x=>x.qty>0&&(filter==='All'||x.category===filter)&&(!q||x.name.toLowerCase().includes(q)||String(x.category).toLowerCase().includes(q)));$('grid').innerHTML=rows.length?rows.map(x=>`<article class="card"><div><div class="name">${esc(x.name)}</div><div class="meta">${esc(x.category)}${x.ml?` · ${x.ml}ml`:''}</div></div><div class="qty"><b>${Number(x.qty)||0}</b><span>available</span></div></article>`).join(''):'<div class="empty">No matching items are currently available.</div>';$('products').textContent=all.filter(x=>x.qty>0).length;$('units').textContent=all.reduce((n,x)=>n+(Number(x.qty)||0),0);$('fragrances').textContent=all.filter(x=>x.qty>0&&x.category!=='General Item').length;$('general').textContent=all.filter(x=>x.qty>0&&x.category==='General Item').length}async function load(){try{const r=await fetch('../stock/public-stock.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('Stock feed unavailable');const d=await r.json();all=Array.isArray(d.items)?d.items:[];$('updated').textContent=d.updatedAt?'Last updated '+new Date(d.updatedAt).toLocaleString():'Stock connected';render()}catch(e){$('updated').textContent='Could not load current stock';$('grid').innerHTML='<div class="empty">Stock is temporarily unavailable.</div>'}}$('search').addEventListener('input',render);document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));render()}));load();setInterval(load,30000);</script></body></html>
